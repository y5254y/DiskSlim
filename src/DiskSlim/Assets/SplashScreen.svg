<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300">
  <defs>
    <linearGradient id="diskGradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B7C3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowSplash" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <g transform="translate(310, 150)" filter="url(#shadowSplash)">
    <circle cx="0" cy="0" r="105" fill="url(#diskGradSplash)"/>
    <circle cx="0" cy="0" r="70" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="35" fill="url(#diskGradSplash)" opacity="0.9"/>
    
    <circle cx="0" cy="0" r="98" fill="none" stroke="#ffffff" stroke-width="10" stroke-dasharray="60,480" stroke-dashoffset="-120" opacity="0.6"/>
    
    <g transform="translate(32, -60) rotate(45)">
      <rect x="0" y="0" width="14" height="95" rx="2" fill="#8B4513"/>
      <rect x="-10" y="88" width="34" height="40" rx="4" fill="#22C55E"/>
      <line x1="-5" y1="88" x2="-5" y2="128" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
      <line x1="7" y1="88" x2="7" y2="128" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
      <line x1="19" y1="88" x2="19" y2="128" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    </g>
    
    <circle cx="52" cy="52" r="22" fill="url(#accentGradSplash)"/>
    <line x1="42" y1="52" x2="62" y2="52" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>