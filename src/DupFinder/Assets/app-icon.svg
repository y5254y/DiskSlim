<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B7C3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="90" fill="url(#diskGrad)"/>
    <circle cx="128" cy="128" r="60" fill="#ffffff" opacity="0.15"/>
    <circle cx="128" cy="128" r="30" fill="url(#diskGrad)" opacity="0.9"/>
    
    <circle cx="128" cy="128" r="85" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="50,400" stroke-dashoffset="-100" opacity="0.6"/>
  </g>
  
  <g transform="translate(160, 70) rotate(45)">
    <rect x="0" y="0" width="12" height="80" rx="2" fill="#8B4513"/>
    <rect x="-8" y="75" width="28" height="35" rx="4" fill="#22C55E"/>
    <line x1="-4" y1="75" x2="-4" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <line x1="4" y1="75" x2="4" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <line x1="12" y1="75" x2="12" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>
  
  <circle cx="180" cy="180" r="18" fill="url(#accentGrad)"/>
  <line x1="172" y1="180" x2="188" y2="180" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>